name: Bug report
description: Report a model, animation, export, or viewer issue
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: game
    attributes:
      label: Game assets
      options:
        - LBA1
        - LBA2
        - LBA2 1996 demo
    validations:
      required: true
  - type: input
    id: body
    attributes:
      label: BODY entry number
      description: Leave blank if the problem is not tied to one model.
  - type: input
    id: animation
    attributes:
      label: Animation entry and frame
      description: Include these if animation is involved.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected, what you saw, and a screenshot if helpful. Please do not upload game archives.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser or OS
      description: For example, Firefox on Linux or the local Godot app.
